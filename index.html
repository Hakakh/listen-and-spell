      // --- Audio Synthesizer (Zero External Dependencies) ---
      const playSound = (type) => {
        try {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          if (!AudioCtx) return;
          const ctx = new AudioCtx();
          const now = ctx.currentTime;

          if (type === 'click') {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(520, now);
            osc.frequency.exponentialRampToValueAtTime(820, now + 0.08);
            gain.gain.setValueAtTime(0.2, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.08);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(now);
            osc.stop(now + 0.08);
          } else if (type === 'wrong') {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(180, now);
            osc.frequency.exponentialRampToValueAtTime(110, now + 0.22);
            gain.gain.setValueAtTime(0.25, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.22);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(now);
            osc.stop(now + 0.22);
          } else if (type === 'gap') {
            // Distinct pleasant audio chime indicating the gap between words
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(440, now);
            osc.frequency.exponentialRampToValueAtTime(660, now + 0.15);
            gain.gain.setValueAtTime(0.2, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(now);
            osc.stop(now + 0.2);
          } else if (type === 'win') {
            [523.25, 659.25, 783.99, 1046.50].forEach((freq, idx) => {
              const osc = ctx.createOscillator();
              const gain = ctx.createGain();
              osc.type = 'triangle';
              osc.frequency.setValueAtTime(freq, now + idx * 0.09);
              gain.gain.setValueAtTime(0.18, now + idx * 0.09);
              gain.gain.exponentialRampToValueAtTime(0.01, now + idx * 0.09 + 0.3);
              osc.connect(gain);
              gain.connect(ctx.destination);
              osc.start(now + idx * 0.09);
              osc.stop(now + idx * 0.09 + 0.3);
            });
          }
        } catch (e) {
          // Audio autoplay restriction fallback
        }
      };

          const steps = [];

              const uppercaseChar = step.char.toUpperCase();
              const lowercaseChar = step.char.toLowerCase();
              const letterData = ALPHABET_DATA[uppercaseChar];

              let highlighted = false;
              const highlightNow = () => {
                if (highlighted || isCancelledRef.current) return;
                highlighted = true;
                if (onLetterHighlight) {
                  onLetterHighlight(step.wordIndex, step.charIndex, step.globalIndex);
                }
              };

              let stepDone = false;
              const advance = () => {
                if (stepDone || isCancelledRef.current) return;
                stepDone = true;
                if (stepSafetyTimer) {
                  clearTimeout(stepSafetyTimer);
                  timerSetRef.current.delete(stepSafetyTimer);
                  stepSafetyTimer = null;
                }
                if (activeAudioRef.current) {
                  activeAudioRef.current = null;
                }

                safeTimeout(() => {
                  if (!isCancelledRef.current) {
                    executeNextStep();
                  }
                }, pauseAfterLetter);
              };

              stepSafetyTimer = safeTimeout(() => {
                highlightNow();
                advance();
              }, maxLetterSafety);

              if (mode === 'phonics') {
                // Phonics Mode: Play authentic high-fidelity audio with speech synthesis fallback
                highlightNow();
                const audio = playPhonicsSound(uppercaseChar, {
                  onEnd: () => {
                    advance();
                  },
                  voice: voice,
                  rate: letterRate
                });
                activeAudioRef.current = audio;
              } else {
                // Alphabet Letter Name Mode: SpeechSynthesis
                const spokenLetterName = letterData ? letterData.speech : uppercaseChar;
                const letterUtterance = new SpeechSynthesisUtterance(spokenLetterName);
                letterUtterance.lang = 'en-US';
                letterUtterance.rate = letterRate;
                if (voice) letterUtterance.voice = voice;

                activeUtteranceRef.current = letterUtterance;
                if (window.__activeSpeechUtterances) window.__activeSpeechUtterances.add(letterUtterance);

                letterUtterance.onstart = highlightNow;

                const speechAdvance = () => {
                  if (window.__activeSpeechUtterances) window.__activeSpeechUtterances.delete(letterUtterance);
                  activeUtteranceRef.current = null;
                  advance();
                };

                letterUtterance.onend = speechAdvance;
                letterUtterance.onerror = (e) => {
                  if (isCancelledRef.current) return;
                  if (e && (e.error === 'canceled' || e.error === 'interrupted')) return;
                  speechAdvance();
                };

                // Ensure instant visual synchronization
                highlightNow();
                if (window.speechSynthesis.paused) window.speechSynthesis.resume();
                window.speechSynthesis.speak(letterUtterance);
              }
            } else if (step.type === 'word_gap') {

              if (onWordGap) onWordGap(true);

          if (trimmed.includes('|')) {
            const parts = trimmed.split('|');
            en = parts[0].trim();
            vi = parts.slice(1).join('|').trim();
          } else if (trimmed.includes('\t')) {
            const parts = trimmed.split('\t');
            en = parts[0].trim();
            vi = parts.slice(1).join(' ').trim();

            en = parts[0].trim();
            vi = parts.slice(1).join(' - ').trim();

          setGameState(GameState.TopicEditor);
        }, []);

        const handleEditTopic = useCallback((topicName) => {
          setEditingTopicName(topicName);
          setGameState(GameState.TopicEditor);
        }, []);

        const handleDeleteTopic = useCallback((topicName) => {
          if (window.confirm(`Bạn có chắc chắn muốn xóa chủ đề "${topicName}" không?`)) {
            setCustomTopics(prev => {
              const updated = { ...prev };
              delete updated[topicName];
              try {
                localStorage.setItem(CUSTOM_TOPICS_STORAGE_KEY, JSON.stringify(updated));
              } catch (e) {
                console.error(e);
              }
              return updated;
            });
          }
        }, []);

        const handleSaveTopic = useCallback((name, sentences, playImmediately) => {
          setCustomTopics(prev => {
            const updated = { ...prev };
            if (editingTopicName && editingTopicName !== name && updated[editingTopicName]) {
              delete updated[editingTopicName];
            }
            updated[name] = sentences;
            try {
              localStorage.setItem(CUSTOM_TOPICS_STORAGE_KEY, JSON.stringify(updated));
            } catch (e) {
              console.error(e);
            }
            return updated;
          });

          if (playImmediately) {
            setSelectedTopic(name);
            setTopicSentences(sentences);
            setPlaySessionKey(prev => prev + 1);
            setGameState(GameState.Playing);
          } else {
            setGameState(GameState.TopicSelection);
          }
        }, [editingTopicName]);

        const handleCancelEditor = useCallback(() => {
          setGameState(GameState.TopicSelection);
        }, []);

        const handleTopicComplete = useCallback((result) => {
          if (typeof result === 'object' && result !== null) {
            setLastScore({
              score: typeof result.score === 'number' ? result.score : ((result.correct || 0) * 10),
              maxScore: typeof result.maxScore === 'number' ? result.maxScore : ((result.total || 0) * 10),
              correct: result.correct || 0,
              total: result.total || 0,
            });
          }
          setGameState(GameState.Congrats);
        }, []);

        const handlePlayAgain = useCallback(() => {
          if (selectedTopic && allTopics[selectedTopic]) {
            setTopicSentences(allTopics[selectedTopic]);
            setPlaySessionKey(prev => prev + 1);
            setGameState(GameState.Playing);
          } else {
            setGameState(GameState.TopicSelection);
          }
        }, [selectedTopic, allTopics]);

        const handleChooseAnotherTopic = useCallback(() => {
          setSelectedTopic('');
          setTopicSentences([]);
          setGameState(GameState.TopicSelection);
        }, []);

        const renderScreen = () => {
          switch (gameState) {
            case GameState.Start:
              return React.createElement(StartScreen, {
                onStart: handleStart,
                onOpenSoundboard: () => setShowSoundboardModal(true),
              });
            case GameState.TopicSelection:
              return React.createElement(TopicSelectionScreen, {
                presetTopics: defaultTopics,
                customTopics: customTopics,
                onSelectTopic: handleSelectTopic,
                onCreateTopic: handleCreateTopic,
                onEditTopic: handleEditTopic,
                onDeleteTopic: handleDeleteTopic,
                onOpenSoundboard: () => setShowSoundboardModal(true),
              });
            case GameState.TopicEditor:
              return React.createElement(TopicEditorScreen, {
                initialTopicName: editingTopicName,
                initialSentences: editingTopicName ? customTopics[editingTopicName] : null,
                existingTopicNames: Object.keys(allTopics),
                onSave: handleSaveTopic,
                onCancel: handleCancelEditor,
              });
            case GameState.Playing:
              return React.createElement(GameScreen, {
                key: `${selectedTopic}-${playSessionKey}`,
                sentences: topicSentences,
                onTopicComplete: handleTopicComplete,
                onChooseAnotherTopic: handleChooseAnotherTopic,
                spellingMode: spellingMode,
                onToggleSpellingMode: (m) => {
                  setSpellingMode(m);
                  try { localStorage.setItem('english_spelling_mode', m); } catch (e) {}
                },
                onOpenSoundboard: () => setShowSoundboardModal(true),
              });
            case GameState.Congrats:
              return React.createElement(TopicCongratsScreen, {
                playerName: playerName,
                topicName: selectedTopic,
                score: lastScore.score,
                maxScore: lastScore.maxScore,
                correctCount: lastScore.correct,
                totalCount: lastScore.total,
                onPlayAgain: handlePlayAgain,
                onChooseAnotherTopic: handleChooseAnotherTopic,
              });
            default:
              return React.createElement(StartScreen, {
                onStart: handleStart,
                onOpenSoundboard: () => setShowSoundboardModal(true),
              });
          }
        };

        return React.createElement('div', { className: "bg-gradient-to-br from-violet-100 via-purple-50 to-sky-100 min-h-screen w-full flex justify-center items-center p-3 sm:p-5" },
          React.createElement('main', { className: "container mx-auto text-center p-5 sm:p-7 max-w-4xl w-full bg-white/95 backdrop-blur-md rounded-3xl shadow-2xl shadow-violet-200 my-3 border border-white relative" },
            React.createElement('h1', { className: "text-2xl sm:text-4xl md:text-5xl font-black text-purple-700 mb-1 tracking-tight" }, "NGHE ĐÁNH VẦN VÀ XẾP TỪ VỰNG"),
            React.createElement('h2', { className: "text-base sm:text-xl text-slate-500 font-bold mb-5" }, "(Listen, Spell & Order Letters)"),
            renderScreen()
          ),
          React.createElement(AlphabetSoundboardModal, {
            isOpen: showSoundboardModal,
            onClose: () => setShowSoundboardModal(false),
            voices: voices,
            currentMode: spellingMode,
            onModeChange: (newMode) => {
              setSpellingMode(newMode);
              try { localStorage.setItem('english_spelling_mode', newMode); } catch (e) {}
            }
          })
        );
      };

      // --- Mount React Root ---
      const rootElement = document.getElementById('root');
      const root = ReactDOM.createRoot(rootElement);
      root.render(React.createElement(App));
    </script>
</body>
</html>
